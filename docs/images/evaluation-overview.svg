t="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">reset</text></g><g class="k6" style="opacity:0"><rect x="-50.6" y="-11" width="101.2" height="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">reset(seed)</text></g><g class="k7" style="opacity:0"><rect x="-54.0" y="-11" width="107.9" height="22" rx="11" fill="var(--raw)"/><text class="pt" x="0" y="4" text-anchor="middle">観測+報酬+正解</text></g><rect class="k8" style="opacity:0" x="410" y="176" width="200" height="212" rx="8" fill="none" stroke="var(--lock)" stroke-width="4"/><g class="k9" style="opacity:0"><rect x="-48.9" y="-11" width="97.8" height="22" rx="11" fill="var(--ok)"/><text class="pt" x="0" y="4" text-anchor="middle">観測（full）</text></g><g class="k10" style="opacity:0"><rect x="-54.2" y="-11" width="108.4" height="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">step(action)</text></g><g class="k11" style="opacity:0"><rect x="-54.2" y="-11" width="108.4" height="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">step(action)</text></g><g class="k12" style="opacity:0"><rect x="-54.0" y="-11" width="107.9" height="22" rx="11" fill="var(--raw)"/><text class="pt" x="0" y="4" text-anchor="middle">観測+報酬+正解</text></g><rect class="k13" style="opacity:0" x="410" y="176" width="200" height="212" rx="8" fill="none" stroke="var(--lock)" stroke-width="4"/><g class="k14" style="opacity:0"><rect x="-59.4" y="-11" width="118.7" height="22" rx="11" fill="var(--ok)"/><text class="pt" x="0" y="4" text-anchor="middle">観測（proprio）</text></g><g class="k15" style="opacity:0"><rect x="-65.0" y="-11" width="130.0" height="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">get_observation</text></g><g class="k16" style="opacity:0"><rect x="-47.0" y="-11" width="94.0" height="22" rx="11" fill="var(--req)"/><text class="pt" x="0" y="4" text-anchor="middle">カメラを描画</text></g><g class="k17" style="opacity:0"><rect x="-38.5" y="-11" width="77.0" height="22" rx="11" fill="var(--raw)"/><text class="pt" x="0" y="4" text-anchor="middle">観測+正解</text></g><rect class="k18" style="opacity:0" x="410" y="176" width="200" height="212" rx="8" fill="none" stroke="var(--lock)" stroke-width="4"/><g class="k19" style="opacity:0"><rect x="-48.9" y="-11" width="97.8" height="22" rx="11" fill="var(--ok)"/><text class="pt" x="0" y="4" text-anchor="middle">観測（full）</text></g><g class="k20" style="opacity:0"><rect x="-32.6" y="-11" width="65.2" height="22" rx="11" fill="var(--req)"/><text class="pt mono" x="0" y="4" text-anchor="middle">finish</text></g><rect class="k21" style="opacity:0" x="420" y="116" width="44.0" height="28" rx="7" fill="none" stroke="var(--req)" stroke-width="3"/><rect class="k21" style="opacity:0" x="466.0" y="116" width="44.0" height="28" rx="7" fill="none" stroke="var(--req)" stroke-width="3"/><g class="k22" style="opacity:0"><text x="20" y="434" font-size="15" font-weight="700" style="fill:var(--req)">① reset</text><text x="196" y="434" font-size="14">試行を1つ始める。seed は gateway が決め、full 階層の観測と指示文が返る</text></g><g class="k23" style="opacity:0"><text x="20" y="434" font-size="15" font-weight="700" style="fill:var(--req)">② step</text><text x="196" y="434" font-size="14">行動を repeat サイクル分進める。返るのはロボット自身の状態（proprio 階層）だけ</text></g><g class="k24" style="opacity:0"><text x="20" y="434" font-size="15" font-weight="700" style="fill:var(--req)">③ get_observation</text><text x="196" y="434" font-size="14">知覚を走らせたいときに、カメラの画像を含む full 階層の観測を取る</text></g><g class="k25" style="opacity:0"><text x="20" y="434" font-size="15" font-weight="700" style="fill:var(--req)">④ finish</text><text x="196" y="434" font-size="14">ジョブを終える。時間が止まり、スコアが確定する</text></g><g class="k26" style="opacity:0"><text x="20" y="434" font-size="14">報酬・成功判定・seed・正解データは、どの応答にも入らない</text></g><rect x="20" y="456" width="14" height="12" rx="6" fill="var(--req)"/><text class="