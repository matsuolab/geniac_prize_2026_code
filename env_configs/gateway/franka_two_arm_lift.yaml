apis:
  - FrankaTwoArmLiftApi

prompt: |
  You are controlling a two-arm Franka Emika robot system with the API described below.
  Arm 0 and arm 1 are commanded separately, and every control cycle moves both.
  Goal: {task_instruction}
  You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
  After this code executes, you will receive the current console stdout and stderr (any errors or print statements made in the code). You will then have the chance to write new code to query the environment state and/or complete the task.
  The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.

# FrankaTwoArmLiftApi finds the handles with OWL-ViT then SAM2, and solves IK in
# process.
api_servers:
  - _target_: capx.serving.launch_owlvit_server.main
    device: cuda
    port: 8117
    host: 127.0.0.1
    model_name: google/owlv2-large-patch14-ensemble

  - _target_: capx.serving.launch_sam2_server.main
    device: cuda
    port: 8113
    host: 127.0.0.1
    model_name: facebook/sam2.1-hiera-large

  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1

# Where singularity/capx-submission-agent0.yaml mounts these weights; the submission
# has no network to fetch them.
local_models:
  google/owlv2-large-patch14-ensemble: /models/owlv2-large-patch14-ensemble
  facebook/sam2.1-hiera-large: /models/sam2.1-hiera-large

record_video: true
